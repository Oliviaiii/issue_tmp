schema_version: 1
source_repository: "Oliviaiii/issue_tmp"
labels_file: "config/labels.tsv"
install_rules:
  issue_form_target: ".github/ISSUE_TEMPLATE"
  agent_skill_target: ".github/skills"
  agent_workflow_example: "config/agent-workflow.example.yml"
  agent_workflow_target: ".github/agent-workflow.yml"
  require_agent_workflow_review_before_activation: true
  default_overwrite: false
  create_branch: true
  create_pull_request: true
  create_missing_labels_only: true
  repository_url_rewrites:
    - path: ".github/ISSUE_TEMPLATE/config.yml"
      source: "https://github.com/Oliviaiii/issue_tmp/security/policy"
      target: "https://github.com/{owner}/{repo}/security/policy"
    - path: ".github/ISSUE_TEMPLATE/config.yml"
      source: "https://github.com/Oliviaiii/issue_tmp/discussions"
      target: "https://github.com/{owner}/{repo}/discussions"
      only_when: "target_repository_has_discussions_enabled"

profiles:
  starter:
    description: "第一次導入：Bug、功能新增與一般任務"
    files:
      - ".github/ISSUE_TEMPLATE/1-bug.yml"
      - ".github/ISSUE_TEMPLATE/2-feature_add.yml"
      - ".github/ISSUE_TEMPLATE/4-task.yml"
      - ".github/ISSUE_TEMPLATE/config.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/SECURITY.md"
    labels: ["錯誤回報", "功能新增", "任務追蹤", "待確認"]

  product:
    description: "產品與專案團隊：補齊修改、UI、調研與文件"
    files:
      - ".github/ISSUE_TEMPLATE/1-bug.yml"
      - ".github/ISSUE_TEMPLATE/2-feature_add.yml"
      - ".github/ISSUE_TEMPLATE/3-feature_change.yml"
      - ".github/ISSUE_TEMPLATE/4-task.yml"
      - ".github/ISSUE_TEMPLATE/5-feature_ui.yml"
      - ".github/ISSUE_TEMPLATE/6-spike_research.yml"
      - ".github/ISSUE_TEMPLATE/7-documentation.yml"
      - ".github/ISSUE_TEMPLATE/config.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/SECURITY.md"
    labels: ["錯誤回報", "功能新增", "功能修改", "任務追蹤", "樣式調整", "技術調研", "文件需求/修正", "待確認"]

  agent:
    description: "產品流程加上 AI Agent 任務表單與四個可調整的 Issue Skills"
    files:
      - ".github/ISSUE_TEMPLATE/1-bug.yml"
      - ".github/ISSUE_TEMPLATE/2-feature_add.yml"
      - ".github/ISSUE_TEMPLATE/3-feature_change.yml"
      - ".github/ISSUE_TEMPLATE/4-task.yml"
      - ".github/ISSUE_TEMPLATE/5-feature_ui.yml"
      - ".github/ISSUE_TEMPLATE/6-spike_research.yml"
      - ".github/ISSUE_TEMPLATE/7-documentation.yml"
      - ".github/ISSUE_TEMPLATE/10-ai_agent_task.yml"
      - ".github/ISSUE_TEMPLATE/config.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/SECURITY.md"
      - ".github/skills/issue-start/SKILL.md"
      - ".github/skills/issue-check/SKILL.md"
      - ".github/skills/issue-qa/SKILL.md"
      - ".github/skills/pr-review/SKILL.md"
      - "config/agent-workflow.example.yml"
      - "docs/agent-skills-使用指南.md"
    labels: ["錯誤回報", "功能新增", "功能修改", "任務追蹤", "樣式調整", "技術調研", "文件需求/修正", "AI 任務", "待確認"]

  full:
    description: "全部 Issue Forms、PR Template 與社群文件"
    files:
      - ".github/ISSUE_TEMPLATE/1-bug.yml"
      - ".github/ISSUE_TEMPLATE/2-feature_add.yml"
      - ".github/ISSUE_TEMPLATE/3-feature_change.yml"
      - ".github/ISSUE_TEMPLATE/4-task.yml"
      - ".github/ISSUE_TEMPLATE/5-feature_ui.yml"
      - ".github/ISSUE_TEMPLATE/6-spike_research.yml"
      - ".github/ISSUE_TEMPLATE/7-documentation.yml"
      - ".github/ISSUE_TEMPLATE/8-support_question.yml"
      - ".github/ISSUE_TEMPLATE/9-incident_prod.yml"
      - ".github/ISSUE_TEMPLATE/10-ai_agent_task.yml"
      - ".github/ISSUE_TEMPLATE/config.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/SECURITY.md"
      - ".github/CONTRIBUTING.md"
      - ".github/CODE_OF_CONDUCT.md"
      - ".github/skills/issue-start/SKILL.md"
      - ".github/skills/issue-check/SKILL.md"
      - ".github/skills/issue-qa/SKILL.md"
      - ".github/skills/pr-review/SKILL.md"
      - "config/agent-workflow.example.yml"
      - "docs/agent-skills-使用指南.md"
    labels: ["錯誤回報", "功能新增", "功能修改", "任務追蹤", "樣式調整", "技術調研", "文件需求/修正", "提問", "線上事故", "AI 任務", "待確認", "重複問題", "適合新手", "歡迎協助", "無效回報", "暫不處理"]

