name: "🔁 功能修改"
description: "調整既有功能的行為、規則或流程"
title: "[功能修改] "
labels: ["功能修改", "待確認"]
body:
  - type: textarea
    id: reason
    attributes:
      label: "修改原因"
      description: "目前造成什麼問題？為什麼需要調整？"
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: "目前行為"
      description: "說明現有流程、規則或畫面如何運作"
    validations:
      required: true

  - type: textarea
    id: desired_behavior
    attributes:
      label: "修改後行為"
      description: "說明希望調整成什麼樣子"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "驗收條件"
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: "影響範圍與相容性"
      value: |
        - 受影響角色／功能：
        - API／資料結構影響：
        - 舊資料或既有流程相容性：

  - type: upload
    id: references
    attributes:
      label: "修改前後畫面或參考資料"
      description: "可上傳現況截圖、預期畫面、流程圖或其他附件"
    validations:
      required: false
