name: "✨ 功能新增"
description: "提出全新功能、流程或頁面需求"
title: "[功能新增] "
labels: ["功能新增", "待確認"]
body:
  - type: markdown
    attributes:
      value: |
        請先描述要解決的問題，再說明想做的功能。這能避免需求只剩下一個指定解法。

  - type: textarea
    id: problem
    attributes:
      label: "問題與背景"
      description: "目前遇到什麼問題？為什麼值得處理？"
    validations:
      required: true

  - type: textarea
    id: user_scenario
    attributes:
      label: "目標使用者與使用情境"
      value: |
        **身為：**
        **我希望：**
        **以便：**
    validations:
      required: true

  - type: textarea
    id: current_workaround
    attributes:
      label: "目前做法或替代方式"
      description: "現在怎麼處理？花費多少時間、容易在哪裡出錯？"

  - type: textarea
    id: scope
    attributes:
      label: "範圍"
      value: |
        **本次要做：**
        -

        **本次不做：**
        -
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "驗收條件"
      description: "用可以確認對錯的條件描述完成標準"
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: success_metric
    attributes:
      label: "成功指標"
      description: "上線後要用什麼數據或觀察判斷功能有效"

  - type: textarea
    id: dependencies
    attributes:
      label: "相依項目與風險"
      description: "相關 Issue、服務、資料、時程或其他限制"

  - type: textarea
    id: quality_constraints
    attributes:
      label: "非功能需求與限制"
      description: "需要考慮的權限、個資、資安、效能、無障礙、多語系、裝置或相容性"

  - type: textarea
    id: rollout
    attributes:
      label: "上線、觀察與回滾方式"
      value: |
        - 上線方式：
        - 需要觀察的指標／Log：
        - 失敗時如何關閉或回滾：

  - type: upload
    id: references
    attributes:
      label: "畫面或參考資料"
      description: "可上傳流程圖、線框圖、設計稿截圖或其他參考檔案"
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.pdf,.docx,.xlsx,.pptx"
