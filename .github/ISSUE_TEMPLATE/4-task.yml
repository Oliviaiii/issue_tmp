name: "🛠️ 任務追蹤"
description: "追蹤具體、可執行且可驗收的工作"
title: "[任務] "
labels: ["任務追蹤", "待確認"]
body:
  - type: textarea
    id: goal
    attributes:
      label: "任務目標"
      description: "這項任務要解決什麼問題或產生什麼結果？"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "工作項目"
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: "本次不做"
      description: "列出容易被誤會包含、但這張任務不處理的內容"

  - type: textarea
    id: done_definition
    attributes:
      label: "完成定義"
      description: "列出可以判定任務完成的條件"
      value: |
        - [ ] 已完成主要工作項目
        - [ ] 已完成必要測試或人工驗證
        - [ ] 已更新相關文件
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "相依項目與注意事項"
      description: "相關 Issue、Pull Request、服務、資料或時程限制"

  - type: textarea
    id: verification
    attributes:
      label: "驗證方式與交付證據"
      value: |
        - 自動測試：
        - 人工驗證：
        - 文件／截圖／Log：
    validations:
      required: true

  - type: upload
    id: references
    attributes:
      label: "參考資料"
      description: "上傳前請移除個資、帳號、Token、Cookie 與客戶資料"
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.log,.json,.zip"
