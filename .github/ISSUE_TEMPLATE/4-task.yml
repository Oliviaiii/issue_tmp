name: "🛠️ 任務追蹤"
description: "追蹤具體、可執行且可驗收的工作"
title: "[任務] "
labels: ["任務追蹤", "待確認"]
body:
  - type: textarea
    id: goal
    attributes:
      label: "任務目標"
      description: "這項任務要解決什麼問題或產生什麼結果？"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "工作項目"
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: done_definition
    attributes:
      label: "完成定義"
      description: "列出可以判定任務完成的條件"
      value: |
        - [ ] 已完成主要工作項目
        - [ ] 已完成必要測試或人工驗證
        - [ ] 已更新相關文件
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "相依項目與注意事項"
      description: "相關 Issue、Pull Request、服務、資料或時程限制"
