name: "🔍 技術調研與試作"
description: "在需求或技術方向不確定時進行研究、試作與可行性驗證"
title: "[技術調研] "
labels: ["技術調研", "待確認"]
body:
  - type: textarea
    id: objective
    attributes:
      label: "要回答的問題"
      description: "這次研究結束後，必須能回答哪些問題？"
      value: |
        -
        -
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "研究範圍"
      value: |
        **會研究：**
        -

        **不研究：**
        -
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: "目前假設與未知事項"
      value: |
        **目前假設：**
        -

        **仍需確認：**
        -

  - type: input
    id: timebox
    attributes:
      label: "時間盒"
      description: "限制研究投入時間，避免無限探索"
      placeholder: "例如：2 個工作天"
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: "研究方式與候選方案"
      description: "預計查哪些資料、驗證哪些方案或製作什麼試作品"

  - type: textarea
    id: deliverables
    attributes:
      label: "產出物"
      value: |
        - [ ] 研究結論
        - [ ] 候選方案比較
        - [ ] 試作品或驗證紀錄
        - [ ] 後續估工或建議
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: "決策標準"
      description: "什麼條件成立時選擇方案 A、方案 B，或決定暫不進行？"
    validations:
      required: true

  - type: textarea
    id: stop_conditions
    attributes:
      label: "停止條件與後續交接"
      description: "遇到哪些條件就停止研究；結論要由誰決策、如何轉成後續 Issue"
