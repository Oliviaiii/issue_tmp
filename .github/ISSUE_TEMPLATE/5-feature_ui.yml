name: "🎨 版型與樣式調整"
description: "提出版型、介面、樣式或視覺調整需求"
title: "[樣式調整] "
labels: ["樣式調整", "待確認"]
body:
  - type: input
    id: page_path
    attributes:
      label: "頁面或功能位置"
      description: "請填網址、路由、頁面名稱或元件名稱"
      placeholder: "例如：/systemSettings#section-order"
    validations:
      required: true

  - type: textarea
    id: request_desc
    attributes:
      label: "現況與調整方向"
      value: |
        **現況／問題：**

        **希望調整成：**
    validations:
      required: true

  - type: dropdown
    id: target_devices
    attributes:
      label: "目標裝置"
      multiple: true
      options:
        - "桌面版"
        - "平板版"
        - "手機版"
        - "所有尺寸"
    validations:
      required: true

  - type: textarea
    id: states
    attributes:
      label: "需要涵蓋的狀態"
      description: "例如：預設、Hover、Loading、空資料、錯誤、停用與權限不足"

  - type: textarea
    id: accessibility
    attributes:
      label: "無障礙與操作需求"
      description: "鍵盤操作、焦點順序、色彩對比、替代文字、縮放或螢幕閱讀器需求"

  - type: textarea
    id: content_i18n
    attributes:
      label: "文案與多語系"
      description: "正式文案、錯誤訊息、空狀態，以及不同語言的長度或換行情境"

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "驗收條件"
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: upload
    id: references
    attributes:
      label: "原始畫面、設計稿或參考資料"
      description: "可上傳修改前畫面、預期畫面與設計稿截圖"
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm,.pdf"
