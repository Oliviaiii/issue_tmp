name: "🚨 線上事故"
description: "追蹤正式環境重大異常、服務退化與緊急處置"
title: "[線上事故][P1] "
labels: ["線上事故", "待確認"]
body:
  - type: markdown
    attributes:
      value: |
        若事故仍在發生，請先依團隊緊急通報流程處理，再補齊這張 Issue。

  - type: dropdown
    id: severity
    attributes:
      label: "嚴重度"
      options:
        - "P0－全站或核心服務不可用"
        - "P1－主要功能受影響"
        - "P2－部分功能退化或體驗明顯受影響"
        - "P3－輕微異常"
    validations:
      required: true

  - type: input
    id: detection
    attributes:
      label: "發現方式"
      description: "例如監控告警、客服回報、使用者回報或人工巡檢"
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: "影響範圍"
      value: |
        - 受影響功能／區域：
        - 受影響使用者／比例：
        - 業務影響：
    validations:
      required: true

  - type: input
    id: incident_owner
    attributes:
      label: "事故負責人"
      description: "填寫目前負責協調處置的人員"
    validations:
      required: true

  - type: input
    id: start_time
    attributes:
      label: "開始時間"
      placeholder: "例如：2026-07-17 10:20（UTC+8）"
    validations:
      required: true

  - type: input
    id: end_time
    attributes:
      label: "結束時間或目前狀態"
      placeholder: "例如：仍在發生／2026-07-17 11:05（UTC+8）"
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: "事件時間線"
      value: |
        - 10:20 發現異常：
        - 10:30 採取措施：
        - 11:05 服務恢復：
    validations:
      required: true

  - type: textarea
    id: mitigation
    attributes:
      label: "緊急處置與目前狀態"
      value: |
        **已採取措施：**

        **目前狀態：**

        **暫時替代方式：**
    validations:
      required: true

  - type: textarea
    id: communications
    attributes:
      label: "對內／對外溝通"
      value: |
        - 已通知對象：
        - 狀態頁／公告：
        - 下次更新時間：

  - type: textarea
    id: data_security
    attributes:
      label: "資料與資安影響"
      description: "是否涉及資料遺失、錯誤寫入、個資、未授權存取或憑證外洩；未知請填「調查中」"

  - type: textarea
    id: follow_up
    attributes:
      label: "後續行動"
      value: |
        - [ ] 確認根本原因
        - [ ] 完成永久修復
        - [ ] 補充監控或告警
        - [ ] 完成事故檢討文件

  - type: upload
    id: evidence
    attributes:
      label: "監控畫面、錯誤紀錄或其他附件"
      description: "上傳前請移除帳號、Token、Cookie 與個人資料"
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm,.log,.txt,.json,.csv,.zip"
