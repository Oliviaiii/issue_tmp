name: "❓ 支援與提問"
description: "提出非錯誤、非功能需求的使用問題或操作疑問"
title: "[提問] "
labels: ["提問", "待確認"]
body:
  - type: markdown
    attributes:
      value: |
        若問題適合開放討論、沒有明確完成條件，也可以改到 Discussions 提問。

  - type: textarea
    id: question
    attributes:
      label: "問題"
      description: "請清楚描述卡住的位置與想得到的答案"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "背景與目標"
      value: |
        **我正在做：**

        **我希望達成：**
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "使用環境"
      description: "系統、版本、瀏覽器或相關工具"

  - type: textarea
    id: tried
    attributes:
      label: "已嘗試的方法"
      description: "請列出已查過的文件、操作步驟與結果"

  - type: upload
    id: evidence
    attributes:
      label: "截圖、紀錄或參考檔案"
      description: "上傳前請移除帳號、Token、Cookie 與個人資料"
    validations:
      required: false
