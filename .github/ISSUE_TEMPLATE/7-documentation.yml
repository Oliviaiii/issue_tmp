name: "📚 文件需求與修正"
description: "新增、補齊或修正 README、規格、API 文件與 SOP"
title: "[文件] "
labels: ["文件需求/修正", "待確認"]
body:
  - type: markdown
    attributes:
      value: |
        ## 文件需求與修正
        請指出文件位置、讀者與缺漏內容，讓更新後的文件可以直接解決問題。


  - type: textarea
    id: location
    attributes:
      label: "📍 文件位置 / 連結"
      description: "請貼文件連結或路徑"
      value: |
        - 文件連結：
        - 位置（repo path / Notion / Drive）：
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🔎 現況問題"
      description: "現在文件缺什麼/哪裡不對/哪裡過期？"
      placeholder: |
        - 缺漏/錯誤點：
        - 造成的影響：
    validations:
      required: true

  - type: input
    id: audience
    attributes:
      label: "目標讀者"
      description: "誰需要閱讀這份文件？"
      placeholder: "例如：新進工程師、產品經理、外部 API 使用者"
    validations:
      required: true

  - type: textarea
    id: expected_update
    attributes:
      label: "✅ 預期補充/修正內容"
      description: "希望補哪些段落/圖/範例？"
      placeholder: |
        - 需要新增：
        - 需要修正：
        - 需要刪除/更新：
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: "依據與 Source of Truth"
      description: "哪些程式碼、API、正式規格或負責人可以確認內容正確"

  - type: textarea
    id: verification
    attributes:
      label: "文件驗證方式"
      value: |
        - [ ] 連結與指令可以實際使用
        - [ ] 範例與目前版本一致
        - [ ] 目標讀者可以依文件完成任務

  - type: textarea
    id: references
    attributes:
      label: "🧩 參考資料（選填）"
      description: "任何能幫助寫文件的資料"
      placeholder: |
        - 相關 issue/PR：
        - 截圖/流程圖：
        - 其他連結：
    validations:
      required: false

  - type: upload
    id: attachments
    attributes:
      label: "截圖、流程圖或其他附件"
      description: "上傳前請移除敏感資訊"
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.pdf,.docx,.xlsx,.pptx"
